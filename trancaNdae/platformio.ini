; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
	-I include
	-I src
upload_protocol = espota
upload_port = 192.168.1.150
upload_flags =
    --auth=espKzaDoEstudante
lib_deps = 
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	mobizt/FirebaseClient@2.2.12
	; (removidos: Keypad (varredura manual) e WiFiManager (Wi-Fi direto))

; ---- Upload via Wi-Fi (OTA) ----
; 1. Grave UMA vez via USB com as linhas abaixo comentadas.
; 2. Descomente as 3 linhas, grave de novo (ainda via USB).
; 3. Daí em diante: upload vai pela rede, sem cabo.
;upload_protocol = espota
;upload_port = 10.0.0.150
;upload_flags = --auth=senha_ota_segura
