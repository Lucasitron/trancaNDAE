# Deploy do Firebase Hosting (site estático em trancaNdae/web).
# O site usa importmap + CDN do Firebase: não há etapa de build/npm.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          entryPoint: trancaNdae/web
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANCANDAE_CD59B }}
          channelId: live
          projectId: trancandae-cd59b
